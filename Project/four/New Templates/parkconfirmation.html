<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservation Confirmation</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background-color: white;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
        h1 {
            text-align: center;
            color: #333;
        }
        p {
            font-size: 18px;
            color: #555;
        }
        .fee {
            font-weight: bold;
            font-size: 24px;
            color: #28a745;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Reservation Confirmed</h1>
        <p>Reservation ID: <strong>{{ reserve_id }}</strong></p>
        <p>Parking Duration: <strong>{{ parking_duration }} hours</strong></p>
        <p>Reservation Time: <strong>{{ reservation_time }}</strong></p>
        <p class="fee">Total Fee: {{ fee }} BDT</p>
    </div>
</body>
</html>
