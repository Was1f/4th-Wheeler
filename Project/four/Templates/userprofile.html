<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .profile-container {
            background-color: maroon;
            color: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        .btn-custom {
            background-color: maroon;
            color: white;
            border: none;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            border-radius: 5px;
            width: 100%;
        }
        .btn-custom:hover {
            background-color: #800000;
        }
        .section-title {
            color: yellow;
        }
    </style>
</head>
<body>
<div class="container mt-4">
    <!-- Profile Info -->
    <div class="profile-container">
        <h1>Welcome, {{ user.first_name }} {{ user.last_name }}</h1>
        <p>User ID: {{ user.id }}</p>
        
        <!-- Are You an Owner -->
        
    </div>

    <!-- Navigation Buttons -->
    <div class="row mb-4">
        <div class="col-md-4">
            <a href="{% url 'car' %}" class="btn btn-primary w-100">Rent a Car</a>
        </div>
        <div class="col-md-4">
            <a href="{% url 'garage' %}" class="btn btn-primary w-100">Rent a Garage</a>
        </div>
        <div class="col-md-4">
            <a href="{% url 'history' %}" class="btn btn-primary w-100">View History</a>
        </div>
    </div>

    <!-- Log Out Button -->
<div class="text-center">
    <a href="{% url 'logout' %}" class="btn btn-custom">Log Out</a>
</div>
<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
