<h2>Garages</h2>
<table>
    <thead>
        <tr>
            <th>Area</th>
            <th>Address</th>
            <th>Slots</th>
            <th>CCTV</th>
            <th>Watchmen</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody>
        {% for garage in garages %}
        <tr>
            <td>{{ garage.area }}</td>
            <td>{{ garage.address }}</td>
            <td>{{ garage.slots }}</td>
            <td>{{ garage.cctv }}</td>
            <td>{{ garage.watchmen }}</td>
            <td><a href="{% url 'edit_garage' garage.garageid %}">Edit</a></td>
        </tr>
        {% endfor %}
    </tbody>
</table>
<a href="{% url 'add_garage' %}">Add Garage</a>
