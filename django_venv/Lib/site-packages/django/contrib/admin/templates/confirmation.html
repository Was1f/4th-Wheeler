<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmation Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 600px;
            margin: 100px auto;
            background-color: white;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }
        h1 {
            text-align: center;
            color: #333;
        }
        p {
            font-size: 18px;
        }
        .fee {
            font-weight: bold;
            font-size: 24px;
            color: #28a745;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Confirmation</h1>
        <p>Destination: {{ destination }}</p>
        <p>Pick up Point: {{ pickup_point }}</p>
        <p class="fee">Total Fee: {{ fee }} BDT</p>
    </div>
</body>
</html>
